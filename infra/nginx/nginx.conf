# Local load balancer and static file server (docker-compose.yml).
# /api/* and /health are shared across server 1, 2 and 3; everything else is the app's static files.

upstream trade_api {
  least_conn;                                   # send each request to the server with the fewest open requests
  server api-1:8080 max_fails=2 fail_timeout=10s;
  server api-2:8080 max_fails=2 fail_timeout=10s;
  server api-3:8080 max_fails=2 fail_timeout=10s;
  keepalive 32;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 10m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  location /api/events {                         # live updates: keep the stream open, don't buffer
    proxy_pass http://trade_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location ~ ^/(api/|health) {
    proxy_pass http://trade_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_next_upstream error timeout http_502 http_503 http_504;   # if one server is down, try the next
  }

  # Static files: images and libraries cached for a long time, the page itself always checked for updates.
  location /assets/ { expires 30d; add_header Cache-Control "public, max-age=2592000, immutable"; }
  location /icons/  { expires 30d; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /config.js { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }

  # Keep repository-only files private.
  location ~ /(\.git|server|infra|scripts|\.github)/ { return 404; }
}
